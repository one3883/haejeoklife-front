<!doctype html>
<meta charset="utf-8">
<body>
<pre id="md">waiting</pre><pre id="dbg"></pre>
<script>
// 자동 플레이 결과(part*.json)를 합쳐 CLAUDE.md 8~10절 기준으로 사건을 판정한다. 직접 열지 말고 check.sh·report.sh로 돌린다.
// 해시 인자: dir(결과 폴더 file:// 주소) parts(part 파일 수) game(게임 index.html 주소) keys(판정할 key 접두어·제목, 쉼표 구분)
// keys가 없으면 문제 있는 사건 전체를 docs/boring-events.md 형식의 마크다운으로 낸다.
const Q = Object.fromEntries(location.hash.slice(1).split("&").filter(Boolean).map((s) => s.split("=")));
const DIR = Q.dir ? decodeURIComponent(Q.dir).replace(/[\/]?$/, "/") : "";
const FILES = Q.files ? Q.files.split(",") : Array.from({ length: +(Q.parts || 4) }, (_, i) => DIR + "part" + (i + 1) + ".json");
if (Q.keys && !Q.only) Q.only = Q.keys;
(async () => {
  const out = [];
  try {
    // 게임의 이름 목록(성·이름)을 읽어 와 사건 제목에서 사람 이름을 ○로 바꾼다
    const fr = document.createElement("iframe"); fr.src = Q.game ? decodeURIComponent(Q.game) : "../../index.html"; fr.style.cssText = "width:10px;height:10px"; document.body.appendChild(fr);
    await new Promise((r) => fr.addEventListener("load", r, { once: true }));
    let POOL = [];
    for (const v of ["surnames", "firstnames", "NPC_FIRST", "NPC_LAST"]) {
      try { const x = fr.contentWindow.eval(v); POOL.push(...(Array.isArray(x) ? x : Object.values(x).flat())); } catch (e) {}
    }
    POOL.push("토마", "리코", "세나", "바르토", "미로", "하루", "젠", "루카", "노아", "카이", "테오", "유나"); // 인연 사건 이름
    POOL = [...new Set(POOL.map(String).filter(Boolean))].sort((a, b) => b.length - a.length);
    const esc = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    // 3글자 이상 이름은 조사 대부분과 함께, 2글자 이하 이름('렌', '하루' 등 보통 낱말과 겹칠 수 있음)은 '의·과·와·에게' + 띄어쓰기일 때만 바꾼다
    const NAME_RE = POOL.map((n) => n.length >= 3
      ? new RegExp("(^|[\\s,·\"'(])" + esc(n) + "(?=(의|과|와|이|가|을|를|은|는|에게|도|[\\s,.!?·)]|$))", "g")
      : new RegExp("(^|[\\s,·\"'(])" + esc(n) + "(?=(의|과|와|에게)(\\s|$))", "g"));
    // 장소 이름은 ◎로 (섬마다 같은 틀인 도착 장면 등을 하나로 묶는다)
    let PLACES = [];
    try { PLACES = [...fr.contentWindow.eval("places").map((x) => x.name), fr.contentWindow.eval("MARIJOA").name]; } catch (e) {}
    PLACES = [...new Set(PLACES.filter(Boolean))].sort((a, b) => b.length - a.length);
    // 측정 단계에서 장소 이름 안의 이름 글자가 ○로 바뀐 변형(나노○, 성지 ○조아 등)도 ◎로 맞춘다
    const PLACE_VARIANTS = [...new Set(PLACES.flatMap((pl) => [pl, pl.replace(/[0-9][0-9,]*/g, "#"), ...POOL.filter((n) => pl.includes(n)).map((n) => pl.split(n).join("○"))]))].sort((a, b) => b.length - a.length);
    const stripNames = (t) => {
      let s = t;
      for (const pl of PLACE_VARIANTS) s = s.split(pl).join("◎");
      for (const re of NAME_RE) s = s.replace(re, "$1○");
      return s.replace(/○(\s*○)+/g, "○");
    };
    const parts = [];
    for (const f of FILES) { try { const t = await (await fetch(f)).text(); parts.push(JSON.parse(t)); } catch (e) { out.push("<!-- " + f + " 읽기 실패: " + e.message + " -->"); } }
    const LIVES = parts.reduce((a, b) => a + (b.lives || 0), 0);
    const ages = parts.flatMap((p) => p.ages || []);
    const errors = [...new Set(parts.flatMap((p) => p.errors || []))];
    const choiceScenes = parts.reduce((a, b) => a + (b.choiceScenes || 0), 0);
    // 합치기
    const EV = {};
    // 이름(○) 뒤 조사 차이는 같은 이벤트로 묶는다: ○과/○와, ○이/○가, ○을/○를, ○은/○는
    const normG = (g) => g.replace(/○(과|와)/g, "○와").replace(/○(이|가)(?=[\s,.!?]|$)/g, "○가").replace(/○(을|를)/g, "○를").replace(/○(은|는)/g, "○는");
    for (const part of parts) for (const [g0, e] of Object.entries(part.events || {})) {
      const g = normG(stripNames(g0));
      const x = (EV[g] = EV[g] || { title: g, key: e.key, count: 0, evals: [] });
      x.count += e.count; if (x.evals.length < 6) x.evals.push(...e.evals.slice(0, 6 - x.evals.length));
    }
    // 같은 틀 묶기: 키 끝에 인물마다 다른 무작위 ID가 붙는 사건(npc_reunion_mfrg85n 등)은 앞부분이 같으면 하나로 본다.
    // 앞부분이 같은 키가 3개 이상이고 끝부분이 모두 6~8자 영숫자일 때만 무작위 ID로 판단한다.
    {
      // 내부 키가 완전히 같은 그룹은 같은 사건 (제목의 이름 처리만 달랐던 경우)
      const byKey = {};
      for (const [g, e] of Object.entries(EV)) if (e.key && e.key !== "-") (byKey[e.key] = byKey[e.key] || []).push(g);
      for (const gs of Object.values(byKey)) {
        if (gs.length < 2) continue;
        gs.sort((a, b) => EV[b].count - EV[a].count);
        const main = EV[gs[0]];
        for (const g of gs.slice(1)) { const e = EV[g]; main.count += e.count; if (main.evals.length < 6) main.evals.push(...e.evals.slice(0, 6 - main.evals.length)); delete EV[g]; }
      }
    }
    {
      const tails = {};
      for (const e of Object.values(EV)) { const k = String(e.key || ""); const i = k.lastIndexOf("_"); if (i > 0) (tails[k.slice(0, i)] = tails[k.slice(0, i)] || new Set()).add(k.slice(i + 1)); }
      const randomFam = new Set(Object.entries(tails).filter(([, s]) => [...s].every((t) => /^[a-z0-9#]{6,8}$/.test(t)) && (s.size >= 3 || (s.size >= 2 && [...s].some((t) => /[0-9#]/.test(t))))).map(([f]) => f));
      const famOf = (e) => { const k = String(e.key || ""); const i = k.lastIndexOf("_"); return i > 0 && randomFam.has(k.slice(0, i)) ? k.slice(0, i) : null; };
      const byFam = {};
      for (const [g, e] of Object.entries(EV)) { const f = famOf(e); if (f) (byFam[f] = byFam[f] || []).push(g); }
      for (const [f, gs] of Object.entries(byFam)) {
        gs.sort((a, b) => EV[b].count - EV[a].count);
        const main = EV[gs[0]];
        for (const g of gs.slice(1)) { const e = EV[g]; main.count += e.count; if (main.evals.length < 6) main.evals.push(...e.evals.slice(0, 6 - main.evals.length)); delete EV[g]; }
        main.key = f + "_<인물>"; main.variants = gs.length;
      }
    }
    const BASE = ["health", "happiness", "knowledge", "relationship", "combat", "reputation", "money", "standing", "lrep"];
    const SCALE = { health: 5, happiness: 5, knowledge: 3, relationship: 4, combat: 3, reputation: 5, standing: 4, lrep: 3 };
    const analyse = (ev) => {
      const age = ev.ctx.age, mscale = age < 16 ? 100 : Math.max(10000, ev.money * 0.05);
      // 기술은 종류별 차원(sk_검술 …)으로 비교한다
      const GOOD = [...BASE, ...new Set(ev.choices.flatMap((c) => Object.keys(c.sum || {}).filter((k) => k.startsWith("sk_"))))];
      const sc = (k) => (k === "money" ? mscale : k.startsWith("sk_") ? 4 : SCALE[k]);
      const C = ev.choices.filter((c) => !c.locked && c.n > 0).map((c) => {
        const mean = {}, min = {};
        for (const k of GOOD) { mean[k] = (c.sum[k] || 0) / c.n / sc(k); min[k] = (c.min[k] ?? 0) / sc(k); }
        // 지속 효과: 게임 상태(스탯·기록·반복방지 장부 제외)가 바뀐 항목들
        const persist = Object.keys(c.perKeys || {}).sort();
        // 현상금은 명성이자 위험이라 좋고 나쁨을 가를 수 없어 '다른 결과'로 친다 (우위·같음 판정에서 구분됨)
        if ((c.sum.bounty || 0) !== 0 || (c.max.bounty ?? 0) !== (c.min.bounty ?? 0)) persist.push("현상금");
        const risky = c.death > 0 || GOOD.some((k) => (c.max[k] ?? 0) - (c.min[k] ?? 0) > 1e-9);
        const loses = c.death > 0 || GOOD.some((k) => min[k] < -0.05);
        const noEffect = !persist.length && !risky && GOOD.every((k) => Math.abs(mean[k]) < 0.05) && !(Math.abs((c.sum.bounty || 0)) > 0);
        const trait = Object.entries(c.traits || {}).sort((a, b) => b[1] - a[1])[0]?.[0] || "-";
        return { title: c.title, mean, min, persist, risky, loses, noEffect, trait, death: c.death / c.n };
      });
      if (C.length < 2) return null;
      // 거의 같음: 모든 쌍의 효과 차이(소 등급 단위 합)가 1 미만이고 지속 효과 구성도 같음
      let maxD = 0;
      for (let i = 0; i < C.length; i++) for (let j = i + 1; j < C.length; j++) {
        let dd = 0; for (const k of GOOD) dd += Math.abs(C[i].mean[k] - C[j].mean[k]);
        if (C[i].persist.join() !== C[j].persist.join() || C[i].risky !== C[j].risky) dd += 1;
        maxD = Math.max(maxD, dd);
      }
      const same = maxD < 1;
      // 우위: A가 B보다 모든 면에서 같거나 낫고(평균·최악), 하나 이상 0.5단위 이상 낫고, 지속 효과 구성이 같거나 많음
      let dom = null;
      for (const A of C) for (const B of C) if (A !== B && !dom) {
        const ge = GOOD.every((k) => A.mean[k] >= B.mean[k] - 0.05 && A.min[k] >= B.min[k] - 0.05) && A.death <= B.death;
        const gt = GOOD.some((k) => A.mean[k] - B.mean[k] >= 0.5);
        const persistOk = B.persist.every((x) => A.persist.includes(x)) && A.persist.length >= B.persist.length;
        if (ge && gt && persistOk) dom = { a: A.title, b: B.title };
      }
      const free = C.filter((c) => !c.loses);
      // CLAUDE.md 8절: 다른 선택지의 이득을 포기하는 것도 잃는 것이다. 단, 선택지 중 최소 하나는 명시적인 대가나 risk가 있어야 한다.
      const noCost = C.every((c) => !c.loses);
      const none = C.filter((c) => c.noEffect);
      const noPersist = C.every((c) => !c.persist.length);
      const sameTrait = new Set(C.map((c) => c.trait)).size === 1;
      const score = (same ? 3 : 0) + (dom ? 3 : 0) + (noCost ? 2 : 0) + (noPersist ? 2 : 0) + none.length * 2;
      if (typeof window.__perStat === "object") for (const c of C) for (const k of c.persist) window.__perStat[k] = (window.__perStat[k] || 0) + 1;
      return { persistShare: C.filter((c) => c.persist.length).length / C.length, persistList: C.map((c) => c.title + ":" + (c.persist.join("+") || "-")), same, dom, noCost, allNone: none.length >= C.length, free: free.map((c) => c.title), none: none.map((c) => c.title), noPersist, sameTrait, trait: C[0].trait, score, n: C.length, ctx: ev.ctx };
    };
    const rows = [];
    let excludedSeeds = 0;
    for (const [g, e] of Object.entries(EV)) {
      // 인연 씨앗은 선택 자체가 몇 년 뒤 회수 사건으로 돌아오는 구조라 이번 검사에서 뺀다
      if (String(e.key || "").startsWith("callback_seed_")) { excludedSeeds++; continue; }
      const A = e.evals.map(analyse).filter(Boolean);
      if (!A.length) continue;
      const frac = (f) => A.filter(f).length / A.length;
      const score = A.reduce((a, b) => a + b.score, 0) / A.length;
      const first = A[0];
      const sig = [...new Set(e.evals.flatMap((v) => v.choices.map((c) => c.title)))].sort().join("|");
      rows.push({ g, key: e.key, count: e.count, score, pr: score * e.count, same: frac((a) => a.same), dom: A.find((a) => a.dom)?.dom || null,
        noCost: frac((a) => a.noCost), allNone: frac((a) => a.allNone), free: [...new Set(A.flatMap((a) => a.free))], none: [...new Set(A.flatMap((a) => a.none))], noPersist: frac((a) => a.noPersist), sameTrait: frac((a) => a.sameTrait), trait: first.trait,
        nChoices: first.n, ctx: first.ctx, sig, persistShare: A.reduce((a, b) => a + b.persistShare, 0) / A.length, persistList: first.persistList, nEval: A.length });
    }
    // 합치기 묶음: 선택지 제목이 똑같은 서로 다른 이벤트(승진 단계·의뢰 대상별 변형 등)는 한 줄로 묶어 전체 등장으로 평가한다
    {
      const bySig0 = {};
      for (const r of rows) (bySig0[r.sig] = bySig0[r.sig] || []).push(r);
      const fam = [];
      for (const rs of Object.values(bySig0)) {
        if (rs.length < 2) { fam.push(rs[0]); continue; }
        rs.sort((a, b) => b.count - a.count);
        const total = rs.reduce((a, b) => a + b.count, 0) || 1;
        const wavg = (f) => rs.reduce((a, r) => a + f(r) * r.count, 0) / total;
        const m = { ...rs[0] };
        m.g = rs[0].g + " 외 " + (rs.length - 1) + "종"; m.count = total;
        m.score = wavg((r) => r.score); m.pr = m.score * total;
        m.same = wavg((r) => r.same); m.noPersist = wavg((r) => r.noPersist); m.sameTrait = wavg((r) => r.sameTrait);
        m.noCost = wavg((r) => r.noCost); m.allNone = wavg((r) => r.allNone); m.free = [...new Set(rs.flatMap((r) => r.free))]; m.none = [...new Set(rs.flatMap((r) => r.none))]; m.dom = rs.find((r) => r.dom)?.dom || null;
        m.twins = rs.map((r) => ({ g: r.g, count: r.count }));
        fam.push(m);
      }
      rows.length = 0; rows.push(...fam);
    }
    const rec = (r) => {
      const allNone = r.allNone >= 0.5; // 측정한 인생 절반 이상에서 모든 선택지가 효과 없음
      if (allNone && r.count < 5) return ["삭제", "선택지가 모두 효과 없음, 1,000판에 " + r.count + "번"];
      if (r.twins) return ["합치기", "선택지가 같은 " + r.twins.length + "종(아래 ‘합치기 묶음’) → 한 틀로 합치거나 묶음별로 선택지를 다르게"];
      if (allNone || (r.same >= 0.5 && r.noPersist >= 0.5)) return ["자동 사건으로 바꾸기", "어느 쪽을 골라도 결과가 같음"];
      if (r.dom) return ["다시 쓰기", "‘" + r.dom.a + "’가 ‘" + r.dom.b + "’보다 모든 면에서 나음 → 우위 선택지에 대가 추가"];
      if (r.noCost >= 0.5) return ["다시 쓰기", "명시적인 대가나 risk가 있는 선택지가 하나도 없음 → 한 선택지 이상에 대가·risk 추가"];
      if (r.noPersist >= 0.5) return ["다시 쓰기", "지속 효과 없음 → 플래그·추억·씨앗 추가"];
      return ["다시 쓰기", ""];
    };
    rows.forEach((r) => { [r.action, r.note] = rec(r); });
    rows.sort((a, b) => b.pr - a.pr || b.score - a.score);
    const prob = (r) => [r.same >= 0.5 ? "결과 거의 같음" : "", r.dom ? "우위 선택지" : "", r.noCost >= 0.5 ? "명시적 대가 없음" : "", r.noPersist >= 0.5 ? "지속 효과 없음" : "", r.none.length ? "효과 없음 " + r.none.length + "개" : ""].filter(Boolean).join(" · ");
    if (Q.only) {
      // 지정한 사건만 판정 결과를 보여 준다 (키 접두어 또는 제목)
      const want = decodeURIComponent(Q.only).split(",");
      // 통과 기준(CLAUDE.md 8·10절): 결과 거의 같음 아님, 우위 선택지 없음, 대가·risk 있는 선택지 하나 이상,
      // 효과 없는 선택지 없음, 지속 효과(플래그·추억·인연·꿈 등, 성향 제외)를 남기는 선택지 40% 이상
      const o = [];
      let nPass = 0, nFail = 0, nMissing = 0;
      for (const w of want) {
        const rs = rows.filter((r) => String(r.key) === w || String(r.key).startsWith(w) || r.g === w || r.g.includes(w));
        if (!rs.length) { nMissing++; o.push(`측정 없음  ${w} — 이번 판들에서 한 번도 안 나왔거나 선택지가 하나뿐임`); continue; }
        for (const r of rs) {
          const why = [r.same >= 0.5 ? "결과 거의 같음" : "", r.dom ? `우위 선택지(‘${r.dom.a}’ > ‘${r.dom.b}’)` : "", r.noCost >= 0.5 ? "명시적 대가 없음" : "",
            r.none.length ? "효과 없는 선택지: " + r.none.join(", ") : "", r.persistShare < 0.4 ? "지속 효과 선택지 40% 미만" : ""].filter(Boolean);
          why.length ? nFail++ : nPass++;
          o.push(`${why.length ? "실패" : "통과"}  ${r.g} (${r.key || "-"}) · 등장 ${r.count} · 측정 ${r.nEval}인생 · 지속 효과 선택지 ${(r.persistShare * 100).toFixed(0)}%${why.length ? "\n      문제: " + why.join(" / ") : ""}`);
          if (Q.verbose) o.push("      " + r.persistList.join(" | "));
        }
      }
      o.unshift(`판정: 통과 ${nPass} · 실패 ${nFail} · 측정 없음 ${nMissing} (판 수 ${LIVES}, 오류 ${errors.length ? errors.join(" / ") : "없음"})`);
      document.getElementById("md").textContent = o.join("\n");
      return;
    }
    const flagged = rows.filter((r) => r.score > 0);
    const cnt = (f) => rows.filter(f).length;
    const totalCount = rows.reduce((a, b) => a + b.count, 0);
    const avgAge = Math.round(ages.reduce((a, b) => a + b, 0) / Math.max(1, ages.length));
    const actions = {}; flagged.forEach((r) => (actions[r.action] = (actions[r.action] || 0) + 1));
    const md = [];
    md.push("# 재미없는 선택 이벤트 목록");
    md.push("");
    md.push(`CLAUDE.md 8~9절 기준으로 선택 이벤트 ${rows.length}종을 검사했다. 문제가 하나라도 있는 이벤트는 ${flagged.length}종이고, 그중 ‘문제 점수 × 등장 빈도’가 큰 순서로 정리했다. 아직 아무것도 고치지 않았다.`);
    md.push("");
    md.push(`8절의 ‘잃는 것’ 기준이 바뀌어 다시 검사했다: 다른 선택지의 이득을 포기하는 것도 잃는 것으로 치고, 선택지 중 최소 하나에 명시적인 대가나 risk가 있는지만 본다. 인연 씨앗(\`callback_seed_*\`, ${excludedSeeds}종)은 몇 년 뒤 회수 사건으로 돌아오는 구조라 검사에서 뺐다.`);
    md.push("");
    md.push(`- 기준 코드: main \`bd8f0b3\`(#46)`);
    md.push(`- 자동 플레이: ${LIVES.toLocaleString()}판 (평균 사망 나이 ${avgAge}세, 선택 사건 ${choiceScenes.toLocaleString()}번 등장). 선택은 무작위로 골랐다.`);
    md.push(`- 효과 측정: 선택 사건이 처음 나왔을 때 최대 3번(서로 다른 인생), 그 순간의 게임 상태를 저장해 두고 선택지마다 6번씩 실제로 실행한 뒤 되돌렸다. 숫자는 게임이 보정(0~100 자르기, 지식·명성 감쇠)한 뒤의 실제 변화다. 기술은 종류별로 따로 비교했고, 선택 결과가 다음 장면(후속 사건)으로 이어지는 것도 선택의 결과로 셌다.`);
    md.push(`- 페이지 오류: ${errors.length ? errors.slice(0, 3).join(" / ") : "없음"}`);
    md.push("");
    md.push("## 판정 기준과 점수");
    md.push("");
    md.push("| 문제 | 판정 | 점수 | 해당 이벤트 |");
    md.push("| --- | --- | --- | --- |");
    md.push(`| 결과가 거의 같음 | 선택지끼리 효과 차이의 합이 ‘소’ 등급 1칸 미만이고 지속 효과·위험 구성이 같음 | 3 | ${cnt((r) => r.same >= 0.5)}종 |`);
    md.push(`| 모든 면에서 우위인 선택지 | 한 선택지가 다른 선택지보다 모든 스탯의 평균·최악값이 같거나 낫고, 하나 이상이 ‘소’ 0.5칸 이상 나음 | 3 | ${cnt((r) => r.dom)}종 |`);
    md.push(`| 명시적 대가 없음 | 어느 선택지에도 명시적인 대가나 risk(어떤 결과에서든 줄어드는 스탯, 사망 위험)가 없음. 다른 선택지의 이득을 포기하는 것은 잃는 것으로 친다(CLAUDE.md 8절) | 2 | ${cnt((r) => r.noCost >= 0.5)}종 |`);
    md.push(`| 지속 효과 없음 | 어느 선택지도 게임 상태를 남기지 않음 (플래그·추억·인연·꿈·직업/신분/거처·연간 효과·씨앗·업적·현상금·후속 사건 등. 스탯·돈·기록·반복 방지 장부와 성향은 제외) | 2 | ${cnt((r) => r.noPersist >= 0.5)}종 |`);
    md.push(`| 효과 없는 선택지 | 아무것도 바뀌지 않음 | 선택지마다 2 | ${cnt((r) => r.none.length)}종 |`);
    md.push("");
    md.push("‘소’ 등급 1칸은 CLAUDE.md 2절 기준이다: 건강·행복·명성 5, 지식·전투력 3, 관계·평판·기술 4, 돈은 어른 연봉의 5%(최소 1만)·15세 이하 100베리. 성향은 게임이 거의 모든 선택지에 자동으로 붙이므로 지속 효과로 치지 않았다(‘성향 같음’ 열에 따로 표시).");
    md.push("");
    md.push(`**추천 처리 집계:** ` + Object.entries(actions).map(([k, v]) => `${k} ${v}종`).join(" · "));
    md.push("");
    md.push("## 우선순위 목록");
    md.push("");
    md.push("우선순위 = 문제 점수 × 1,000판 등장 횟수. 등장 횟수가 많을수록 플레이어가 자주 보는 이벤트다.");
    md.push("");
    md.push("| 순위 | 이벤트 | 키 | 1,000판 등장 | 문제 | 점수 | 우선순위 | 성향 같음 | 추천 처리 | 근거 |");
    md.push("| --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |");
    window.__all = flagged; flagged.slice(0, 120).forEach((r, i) => {
      const k = String(r.key || "").replace(/[0-9.]+$/, "#").replace(/\|/g, "/");
      md.push(`| ${i + 1} | ${r.g.replace(/\|/g, "/")} | \`${k || "-"}\` | ${r.count.toLocaleString()} | ${prob(r)} | ${r.score.toFixed(1)} | ${Math.round(r.pr).toLocaleString()} | ${r.sameTrait >= 0.5 ? "예(" + r.trait + ")" : ""} | ${r.action} | ${String(r.note).replace(/\|/g, "/")} |`);
    });
    if (flagged.length > 120) md.push(`\n표에는 상위 120종만 넣었다. 나머지 ${flagged.length - 120}종은 우선순위가 ${Math.round(flagged[119].pr)} 이하다.`);
    md.push("");
    // 자동 사건 후보 전체: 상위 120위 밖에 있어도 빠짐없이 보이게
    const autos = flagged.filter((r) => r.action === "자동 사건으로 바꾸기");
    md.push("## 자동 사건으로 바꾸기 후보 전체");
    md.push("");
    md.push(`어느 쪽을 골라도 결과가 같거나(후속 사건 포함) 모든 선택지가 효과 없는 이벤트 ${autos.length}종이다. 우선순위 순서다.`);
    md.push("");
    md.push("| 순위 | 이벤트 | 키 | 1,000판 등장 | 문제 | 우선순위 |");
    md.push("| --- | --- | --- | --- | --- | --- |");
    autos.forEach((r, i) => {
      const k = String(r.key || "").replace(/[0-9.]+$/, "#").replace(/\|/g, "/");
      md.push(`| ${i + 1} | ${r.g.replace(/\|/g, "/")} | \`${k || "-"}\` | ${r.count.toLocaleString()} | ${prob(r)} | ${Math.round(r.pr).toLocaleString()} |`);
    });
    md.push("");
    // 합치기 묶음: 선택지 제목이 똑같은 서로 다른 이벤트들
    const groups = rows.filter((r) => r.twins).map((r) => ({ rs: r.twins, total: r.count, choices: r.sig.split("|") })).sort((a, b) => b.total - a.total);
    md.push("## 합치기 묶음");
    md.push("");
    md.push(`선택지 제목이 똑같은 서로 다른 이벤트 묶음 ${groups.length}개다. 하나의 틀(제목·본문만 바뀌는 사건)로 합치거나, 묶음마다 선택지를 다르게 다시 쓴다. 등장 합계가 큰 순서다.`);
    md.push("");
    md.push("| 묶음 | 이벤트 (1,000판 등장) | 등장 합계 | 공통 선택지 |");
    md.push("| --- | --- | --- | --- |");
    groups.slice(0, 40).forEach((gr, i) => {
      const ev = gr.rs.slice(0, 6).map((r) => `${r.g.replace(/\|/g, "/")} (${r.count})`).join(", ") + (gr.rs.length > 6 ? ` 외 ${gr.rs.length - 6}종` : "");
      md.push(`| ${i + 1} | ${ev} | ${gr.total.toLocaleString()} | ${gr.choices.slice(0, 4).join(" / ").replace(/\|/g, "/")}${gr.choices.length > 4 ? " …" : ""} |`);
    });
    if (groups.length > 40) md.push(`\n표에는 상위 40개 묶음만 넣었다.`);
    md.push("");
    md.push("## 측정의 한계");
    md.push("");
    md.push("- 선택은 무작위였다. 실제 플레이어의 선택 경향이 다르면 등장 빈도도 달라진다.");
    md.push("- 효과는 이벤트가 처음 나온 몇몇 인생에서만 쟀다. 신분·나이에 따라 결과가 크게 바뀌는 이벤트는 다른 상황에서 결과가 다를 수 있다.");
    md.push("- 전투가 걸린 선택지는 전략 전투를 끈 상태(즉시 판정)로 쟀다.");
    md.push("- 이름이 바뀌는 이벤트는 이름을 ○, 숫자를 #으로 바꿔 같은 이벤트로 묶었다.");
    md.push("- 1,000판에 한 번도 안 나온 이벤트는 측정되지 않아 이 목록에 없다.");
    document.getElementById("md").textContent = md.join("\n");
  } catch (e) { document.getElementById("md").textContent = "ERR " + e.stack; }
})();
</script>
